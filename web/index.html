<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sigma Forge</title>
  <meta name="description" content="Convert Sigma rules to 31 SIEM, EDR and log platforms and map them to MITRE ATT&CK.">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/gif" href="/assets/img/logo.gif">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/assets/css/root.css?v=4.0">
  <link rel="stylesheet" href="/assets/css/app.css?v=4.0">
  <script type="module" src="/assets/js/app.js?v=4.0"></script>
</head>
<body>
  <div class="splash" id="splash" role="status" aria-live="polite">
    <img class="splash__logo" src="/assets/img/logo.gif" alt="" width="148" height="148">
    <div class="splash__name">Sigma <span>Forge</span></div>
    <div class="splash__text" id="splashText">Warming up the forge</div>
    <div class="splash__bar"><span></span></div>
  </div>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar" id="topbar">
    <div class="topbar__inner">
      <a class="brand" href="/" data-link>
        <img class="brand__logo" src="/assets/img/logo.gif" alt="" width="36" height="36">
        <span class="brand__name">Sigma <span class="brand__accent">Forge</span></span>
      </a>
      <button class="nav-toggle" id="navToggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mainNav">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav" id="mainNav" aria-label="Main">
        <a class="nav__link" href="/" data-link data-route="workspace">Workspace</a>
        <a class="nav__link" href="/convert" data-link data-route="convert">Convert</a>
        <a class="nav__link" href="/coverage" data-link data-route="coverage">Coverage</a>
        <a class="nav__link" href="/editor" data-link data-route="editor">Editor</a>
        <a class="nav__link" href="/compare" data-link data-route="compare">Compare</a>
        <a class="nav__link" href="/test" data-link data-route="test">Test</a>
        <a class="nav__link" href="/hunt" data-link data-route="hunt">Hunt</a>
        <a class="nav__link" href="/yara" data-link data-route="yara">YARA</a>
        <a class="nav__link" href="/library" data-link data-route="library">Library</a>
        <a class="nav__link" href="/rules" data-link data-route="rules">Rules</a>
        <a class="nav__link" href="/mappings" data-link data-route="mappings">Mappings</a>
      </nav>
      <div class="topbar__tools">
        <span class="rule-count" id="ruleCount" title="Rules in your workspace">0 rules</span>
        <button class="icon-btn" id="themeToggle" type="button" title="Switch theme" aria-label="Switch theme">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="main" id="main" tabindex="-1"></main>

  <footer class="footer">
    <div class="footer__inner">
      <img class="footer__logo" src="/assets/img/logo.gif" alt="" width="22" height="22">
      <span>Sigma Forge</span>
      <a class="footer__link" href="https://qayssarayra.com" target="_blank" rel="noopener noreferrer">qayssarayra.com</a>
    </div>
  </footer>

  <aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <div class="drawer__scrim" data-close></div>
    <div class="drawer__panel">
      <div class="drawer__head">
        <img class="drawer__logo" src="/assets/img/logo.gif" alt="" width="28" height="28">
        <h2 class="drawer__title" id="drawerTitle"></h2>
        <button class="icon-btn" type="button" data-close aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="drawer__body" id="drawerBody"></div>
    </div>
  </aside>

  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
