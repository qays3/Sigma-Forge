name: Sigma Forge
description: Validate, test, convert and measure ATT&CK coverage of Sigma rules on every push and pull request
author: qays3
branding:
  icon: shield
  color: purple
inputs:
  rules:
    description: Folder or file with Sigma rules, relative to the repository root
    required: true
    default: rules
  min-quality:
    description: Fail rules with a quality score below this (0 turns it off)
    required: false
    default: "0"
  fail-on:
    description: Fail on findings of this severity or worse (low, medium, high, critical, never)
    required: false
    default: high
  test-generated:
    description: Generate matching events for every rule and fail when a rule does not fire on them
    required: false
    default: "true"
  logs:
    description: Optional space separated log files (EVTX or JSON) to run the rules on
    required: false
    default: ""
  convert-to:
    description: Optional space separated target ids to convert to, for example "splunk sentinel_asim"
    required: false
    default: ""
  min-coverage:
    description: Fail when ATT&CK coverage is below this percent (0 turns it off)
    required: false
    default: "0"
  yara-rules:
    description: Optional folder with YARA rules to check on every push
    required: false
    default: ""
  python-version:
    description: Python version
    required: false
    default: "3.12"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install Sigma Forge
      shell: bash
      run: |
        python -m pip install --quiet -r "${{ github.action_path }}/requirements.txt"
        python -m pip install --quiet --no-deps -r "${{ github.action_path }}/requirements-legacy.txt" || true
    - name: Validate
      shell: bash
      working-directory: ${{ github.action_path }}
      run: python -m app.cli validate "${{ github.workspace }}/${{ inputs.rules }}" --fail-on "${{ inputs.fail-on }}" --min-quality "${{ inputs.min-quality }}"
    - name: Test on generated events
      if: ${{ inputs.test-generated == 'true' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      run: python -m app.cli test "${{ github.workspace }}/${{ inputs.rules }}" --generate --mode strict --expect-all
    - name: Test on logs
      if: ${{ inputs.logs != '' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        files=()
        for f in ${{ inputs.logs }}; do files+=("${{ github.workspace }}/$f"); done
        python -m app.cli test "${{ github.workspace }}/${{ inputs.rules }}" --logs "${files[@]}"
    - name: Convert
      if: ${{ inputs.convert-to != '' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        mkdir -p "${{ github.workspace }}/sigma-forge-output"
        for t in ${{ inputs.convert-to }}; do
          python -m app.cli convert "${{ github.workspace }}/${{ inputs.rules }}" -t "$t" -o "${{ github.workspace }}/sigma-forge-output/$t"
        done
    - name: Coverage
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        mkdir -p "${{ github.workspace }}/sigma-forge-output"
        python -m app.cli coverage "${{ github.workspace }}/${{ inputs.rules }}" \
          --navigator "${{ github.workspace }}/sigma-forge-output/navigator-layer.json" \
          --report "${{ github.workspace }}/sigma-forge-output/coverage-report.html" \
          --min-coverage "${{ inputs.min-coverage }}"
    - name: Check YARA rules
      if: ${{ inputs.yara-rules != '' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      run: python -m app.cli yara "${{ github.workspace }}/${{ inputs.yara-rules }}"
