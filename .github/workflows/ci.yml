name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install --no-deps -r requirements-legacy.txt || true
      - name: Unit tests
        run: python -m pytest -q
      - name: Validate the sample rules
        run: python -m app.cli validate sample/rules --fail-on critical --summary "$GITHUB_STEP_SUMMARY" || true
      - name: Test every sample rule on generated events
        run: python -m app.cli test sample/rules/windows sample/rules/linux sample/rules/attack --generate --mode strict --expect-all
      - name: Check and scan the sample YARA rules
        run: python -m app.cli yara sample/yara/rules --scan sample/yara/files
      - name: Turn a query into a rule
        run: python -m app.cli from-query 'index=win EventCode=1 Image="*\\certutil.exe" CommandLine="*urlcache*"'
