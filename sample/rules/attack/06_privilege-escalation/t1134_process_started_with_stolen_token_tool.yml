title: Process Started With Stolen Token Tool
id: 94c550f2-ea0c-5dcb-b6a0-2bf822098fb9
status: experimental
description: Sample rule for T1134 Access Token Manipulation. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before production
  use.
references:
- https://attack.mitre.org/techniques/T1134
author: Sigma Forge samples
date: '2026-11-11'
tags:
- attack.privilege-escalation
- attack.stealth
- attack.t1134
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
    - Invoke-TokenManipulation
    - incognito.exe
    - -CreateProcess
  condition: selection
falsepositives:
- Admin activity that looks the same
level: high
