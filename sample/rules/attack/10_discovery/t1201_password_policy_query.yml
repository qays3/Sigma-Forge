title: Password Policy Query
id: d1cbd23e-e886-564e-80c2-8089b9f37c86
status: experimental
description: Sample rule for T1201 Password Policy Discovery. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before production
  use.
references:
- https://attack.mitre.org/techniques/T1201
author: Sigma Forge samples
date: '2026-11-11'
tags:
- attack.discovery
