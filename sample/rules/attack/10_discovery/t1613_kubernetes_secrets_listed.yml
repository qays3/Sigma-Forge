title: Kubernetes Secrets Listed
id: c9a86c8a-7363-589c-ba8c-083b6bcfd2d8
status: experimental
description: Sample rule for T1613 Container and Resource Discovery. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before production
  use.
references:
- https://attack.mitre.org/techniques/T1613
author: Sigma Forge samples
date: '2026-11-11'
tags:
