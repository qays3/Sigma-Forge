title: USB Device Listing
id: e9cddd9b-ef43-53f7-91cd-944c8f22ac4c
status: experimental
description: Sample rule for T1120 Peripheral Device Discovery. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before production
  use.
references:
- https://attack.mitre.org/techniques/T1120
author: Sigma Forge samples
date: '2026-11-11'
tags:
- attack.discovery
- attack.t1120
logsource:
  category: ps_script
  product: windows
detection:
  selection:
    ScriptBlockText|contains:
    - Win32_USBControllerDevice
    - Get-PnpDevice -Class USB
  condition: selection
falsepositives:
- Admin activity that looks the same
level: low
