title: Window Title Listing In Script
id: 30c333d9-7a75-5c36-9643-ebcbb1b3e1db
status: experimental
description: Sample rule for T1010 Application Window Discovery. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before production
  use.
references:
- https://attack.mitre.org/techniques/T1010
author: Sigma Forge samples
date: '2026-11-11'
tags:
- attack.discovery
- attack.t1010
logsource:
  category: ps_script
  product: windows
detection:
  selection:
    ScriptBlockText|contains:
    - MainWindowTitle
    - EnumWindows
  condition: selection
falsepositives:
- Admin activity that looks the same
level: low
