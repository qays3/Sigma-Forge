title: Network Share Listing
id: 71e9037b-dbf8-5a77-9e85-ae3b83055b3c
status: experimental
description: Sample rule for T1135 Network Share Discovery. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before production
  use.
references:
- https://attack.mitre.org/techniques/T1135
author: Sigma Forge samples
date: '2026-11-11'
tags:
- attack.discovery
- attack.t1135
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: \net.exe
    CommandLine|contains:
    - view \\
    - share
  condition: selection
falsepositives:
- Admin activity that looks the same
level: low
