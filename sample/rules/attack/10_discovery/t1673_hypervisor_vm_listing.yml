title: Hypervisor VM Listing
id: 6704d0eb-a67a-54c5-a983-bfced06908c7
status: experimental
description: Sample rule for T1673 Virtual Machine Discovery. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before production
  use.
references:
- https://attack.mitre.org/techniques/T1673
author: Sigma Forge samples
date: '2026-11-11'
tags:
- attack.discovery
- attack.t1673
logsource:
  product: esxi
  service: shell
detection:
  selection:
    command|contains:
    - esxcli vm process list
    - vim-cmd vmsvc/getallvms
  condition: selection
falsepositives:
- Admin activity that looks the same
level: medium
