title: Netstat Lists Connections
id: c499a858-ef95-5885-80bf-b77f88c91f48
status: experimental
description: Sample rule for T1049 System Network Connections Discovery. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before
  production use.
references:
- https://attack.mitre.org/techniques/T1049
author: Sigma Forge samples
date: '2026-11-11'
tags:
- attack.discovery
- attack.t1049
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: \netstat.exe
    CommandLine|contains: -ano
  condition: selection
falsepositives:
- Admin activity that looks the same
level: low
