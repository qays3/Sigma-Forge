title: Group Policy Result Report
id: 5ba9d4b3-dc51-553c-880a-1162b6eaddd3
status: experimental
description: Sample rule for T1615 Group Policy Discovery. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before production use.
references:
- https://attack.mitre.org/techniques/T1615
author: Sigma Forge samples
date: '2026-11-11'
tags:
- attack.discovery
- attack.t1615
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: \gpresult.exe
    CommandLine|contains:
    - /z
    - /v
    - '/h '
  condition: selection
falsepositives:
- Admin activity that looks the same
level: low
