title: Mailbox Flooded With Signup Mails
id: b7fb15fd-558c-5d5b-8e5c-a763d6b67ca2
status: experimental
description: Sample rule for T1667 Email Bombing. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before production use.
references:
- https://attack.mitre.org/techniques/T1667
author: Sigma Forge samples
date: '2026-11-11'
tags:
- attack.impact
- attack.t1667
logsource:
  product: m365
  service: audit
detection:
  selection:
    Operation: MailItemsAccessed
    ClientInfoString|contains: bulk
  condition: selection
falsepositives:
- Admin activity that looks the same
level: low
