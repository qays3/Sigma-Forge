title: Process Started From Removable Drive Root
id: dd3340be-2225-5b44-91a8-c1f84c769485
status: experimental
description: Sample rule for T1091 Replication Through Removable Media. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before
  production use.
references:
- https://attack.mitre.org/techniques/T1091
author: Sigma Forge samples
date: '2026-11-11'
tags:
- attack.initial-access
- attack.lateral-movement
- attack.t1091
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|re: ^[D-Z]:\\[^\\]+\.exe$
    ParentImage|endswith: \explorer.exe
  condition: selection
falsepositives:
- Admin activity that looks the same
level: medium
