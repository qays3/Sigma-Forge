title: Office App Writes Script To Disk
id: 68adf783-3815-5214-b50f-c9b4c616f8ee
status: experimental
description: Sample rule for T1566 Phishing. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before production use.
references:
- https://attack.mitre.org/techniques/T1566
author: Sigma Forge samples
date: '2026-11-11'
tags:
- attack.initial-access
- attack.t1566
logsource:
  category: file_event
  product: windows
detection:
  selection:
    Image|endswith:
    - \WINWORD.EXE
    - \EXCEL.EXE
    - \OUTLOOK.EXE
    TargetFilename|endswith:
    - .js
    - .vbs
    - .hta
    - .lnk
  condition: selection
falsepositives:
- Admin activity that looks the same
level: high
