title: Browser Password Store Read By Script
id: c19bcdaf-184d-5adf-b801-92b73bb8b4db
status: experimental
description: Sample rule for T1555 Credentials from Password Stores. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before production
  use.
references:
- https://attack.mitre.org/techniques/T1555
author: Sigma Forge samples
date: '2026-11-11'
tags:
- attack.credential-access
- attack.t1555
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith:
    - \Login Data
    - \logins.json
    - \key4.db
    Image|endswith:
    - \powershell.exe
    - \python.exe
    - \cmd.exe
  condition: selection
falsepositives:
- Admin activity that looks the same
level: high
