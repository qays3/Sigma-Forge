title: Search For Passwords In Files
id: dd4fe68c-3d50-5dd5-bffe-6aab4d74c977
status: experimental
description: Sample rule for T1552 Unsecured Credentials. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before production use.
references:
- https://attack.mitre.org/techniques/T1552
author: Sigma Forge samples
date: '2026-11-11'
tags:
- attack.credential-access
- attack.t1552
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: \findstr.exe
    CommandLine|contains:
    - password
    - cpassword
  condition: selection
falsepositives:
- Admin activity that looks the same
level: medium
