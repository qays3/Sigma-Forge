title: Double Extension File Executed
id: b502e168-63fe-58f6-b623-dd6585b02bfd
status: experimental
description: Sample rule for T1204 User Execution. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before production use.
references:
- https://attack.mitre.org/techniques/T1204
author: Sigma Forge samples
date: '2026-11-11'
tags:
- attack.execution
- attack.t1204
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
    - .pdf.exe
    - .docx.exe
    - .jpg.scr
    - .txt.exe
  condition: selection
falsepositives:
- Admin activity that looks the same
level: high
