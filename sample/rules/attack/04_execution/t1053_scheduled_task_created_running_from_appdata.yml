title: Scheduled Task Created Running From AppData
id: a51fcef8-9c3c-5489-af70-e77c10c49b34
status: experimental
description: Sample rule for T1053 Scheduled Task/Job. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before production use.
references:
- https://attack.mitre.org/techniques/T1053
author: Sigma Forge samples
date: '2026-11-11'
tags:
- attack.execution
- attack.persistence
- attack.privilege-escalation
- attack.t1053
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: \schtasks.exe
    CommandLine|contains|all:
    - /create
    - \AppData\
  condition: selection
falsepositives:
- Admin activity that looks the same
level: high
