title: Rundll32 Loads DLL From Temp
id: 718c23f4-5cbd-55e4-888b-7bf0f2df0dc7
status: experimental
description: Sample rule for T1129 Shared Modules. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before production use.
references:
- https://attack.mitre.org/techniques/T1129
author: Sigma Forge samples
date: '2026-11-11'
tags:
- attack.execution
- attack.t1129
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: \rundll32.exe
    CommandLine|contains:
    - \Temp\
    - \Downloads\
  condition: selection
falsepositives:
- Admin activity that looks the same
level: medium
