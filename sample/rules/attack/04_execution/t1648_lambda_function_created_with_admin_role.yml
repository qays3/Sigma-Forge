title: Lambda Function Created With Admin Role
id: 882b6c02-83f8-5930-8daf-507fe9b12a8a
status: experimental
description: Sample rule for T1648 Serverless Execution. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before production use.
references:
- https://attack.mitre.org/techniques/T1648
author: Sigma Forge samples
date: '2026-11-11'
tags:
- attack.execution
- attack.t1648
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: lambda.amazonaws.com
    eventName: CreateFunction20150331
    requestParameters.role|contains: admin
  condition: selection
falsepositives:
- Admin activity that looks the same
level: medium
