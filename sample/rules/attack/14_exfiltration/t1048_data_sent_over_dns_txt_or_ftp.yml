title: Data Sent Over DNS TXT Or FTP
id: a2225d81-3fe1-5a26-bb23-c74616a6549e
status: experimental
description: Sample rule for T1048 Exfiltration Over Alternative Protocol. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before
  production use.
references:
- https://attack.mitre.org/techniques/T1048
author: Sigma Forge samples
date: '2026-11-11'
tags:
- attack.exfiltration
- attack.t1048
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: \ftp.exe
    CommandLine|contains: '-s:'
  condition: selection
falsepositives:
- Admin activity that looks the same
level: medium
