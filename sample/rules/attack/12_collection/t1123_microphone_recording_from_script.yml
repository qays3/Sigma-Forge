status: experimental
description: Sample rule for T1123 Audio Capture. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before production use.
references:
- https://attack.mitre.org/techniques/T1123
author: Sigma Forge samples
