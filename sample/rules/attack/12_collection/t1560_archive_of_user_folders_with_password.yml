title: Archive Of User Folders With Password
id: 8b5af268-d3b0-5100-bf98-c170d5508722
status: experimental
description: Sample rule for T1560 Archive Collected Data. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before production use.
references:
- https://attack.mitre.org/techniques/T1560
author: Sigma Forge samples
date: '2026-11-11'
tags:
- attack.collection
- attack.t1560
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
    - \7z.exe
    - \rar.exe
    - \WinRAR.exe
    CommandLine|contains:
    - ' -p'
    - ' -hp'
  condition: selection
falsepositives:
- Admin activity that looks the same
level: medium
