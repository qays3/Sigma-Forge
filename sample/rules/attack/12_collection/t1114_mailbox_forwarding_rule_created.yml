status: experimental
description: Sample rule for T1114 Email Collection. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before production use.
references:
- https://attack.mitre.org/techniques/T1114
author: Sigma Forge samples
date: '2026-11-11'
tags:
- attack.collection
