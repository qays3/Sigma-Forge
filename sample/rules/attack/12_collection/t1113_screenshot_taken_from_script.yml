title: Screenshot Taken From Script
id: d47c4ac0-ebbb-533d-9594-a477d84998a4
status: experimental
description: Sample rule for T1113 Screen Capture. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before production use.
references:
- https://attack.mitre.org/techniques/T1113
author: Sigma Forge samples
date: '2026-11-11'
tags:
- attack.collection
- attack.t1113
logsource:
  category: ps_script
  product: windows
detection:
  selection:
    ScriptBlockText|contains:
    - CopyFromScreen
    - System.Drawing.Bitmap
  condition: selection
falsepositives:
- Admin activity that looks the same
level: medium
