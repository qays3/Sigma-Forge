title: Browser Started With Remote Debugging Port
id: 9e5d202c-f2d9-56d8-aa4e-7ed16f02796a
status: experimental
description: Sample rule for T1185 Browser Session Hijacking. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before production
  use.
references:
- https://attack.mitre.org/techniques/T1185
author: Sigma Forge samples
date: '2026-11-11'
tags:
- attack.collection
- attack.t1185
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
    - \chrome.exe
    - \msedge.exe
    CommandLine|contains: --remote-debugging-port
  condition: selection
falsepositives:
- Admin activity that looks the same
level: medium
