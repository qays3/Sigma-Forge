title: Icacls Grants Everyone Full Control
id: 90243aa9-88e6-544b-89fb-e3da6707b8d5
status: experimental
description: Sample rule for T1222 File and Directory Permissions Modification. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it
  before production use.
references:
- https://attack.mitre.org/techniques/T1222
author: Sigma Forge samples
date: '2026-11-11'
tags:
- attack.defense-impairment
- attack.t1222
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: \icacls.exe
    CommandLine|contains:
    - Everyone:F
    - Everyone:(F)
    - '*S-1-1-0:F'
  condition: selection
falsepositives:
- Admin activity that looks the same
level: medium
