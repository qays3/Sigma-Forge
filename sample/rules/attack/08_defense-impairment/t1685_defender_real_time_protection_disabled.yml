title: Defender Real Time Protection Disabled
id: 99fac89e-140d-5817-8f64-1b928cc04129
status: experimental
description: Sample rule for T1685 Disable or Modify Tools. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before production
  use.
references:
- https://attack.mitre.org/techniques/T1685
author: Sigma Forge samples
date: '2026-11-11'
tags:
- attack.defense-impairment
- attack.t1685
logsource:
  category: ps_script
  product: windows
detection:
  selection:
    ScriptBlockText|contains:
    - Set-MpPreference -DisableRealtimeMonitoring $true
    - Set-MpPreference -DisableIOAVProtection $true
  condition: selection
falsepositives:
- Admin activity that looks the same
level: high
