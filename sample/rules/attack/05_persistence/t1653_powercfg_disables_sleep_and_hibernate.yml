title: Powercfg Disables Sleep And Hibernate
id: 2f43a821-9567-54ec-8c0c-c96f13f2ff89
status: experimental
description: Sample rule for T1653 Power Settings. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before production use.
references:
- https://attack.mitre.org/techniques/T1653
author: Sigma Forge samples
date: '2026-11-11'
tags:
- attack.persistence
- attack.t1653
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: \powercfg.exe
    CommandLine|contains:
    - /hibernate off
    - -change -standby-timeout-ac 0
  condition: selection
falsepositives:
- Admin activity that looks the same
level: low
