title: OAuth App Granted Mail Read All
id: a8d2affc-86fc-57f2-96a4-0765ef04461a
status: experimental
description: Sample rule for T1671 Cloud Application Integration. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before production
  use.
references:
- https://attack.mitre.org/techniques/T1671
author: Sigma Forge samples
date: '2026-11-11'
tags:
- attack.persistence
- attack.t1671
logsource:
  product: m365
  service: audit
detection:
  selection:
    Operation: Consent to application.
    ModifiedProperties|contains:
    - Mail.Read
    - Mail.ReadWrite
  condition: selection
falsepositives:
- Admin activity that looks the same
level: medium
