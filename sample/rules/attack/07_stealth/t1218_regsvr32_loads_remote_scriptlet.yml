title: Regsvr32 Loads Remote Scriptlet
id: db9522e5-5f27-5a63-89bd-2033f3ac8d7c
status: experimental
description: Sample rule for T1218 System Binary Proxy Execution. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before production
  use.
references:
- https://attack.mitre.org/techniques/T1218
author: Sigma Forge samples
date: '2026-11-11'
tags:
- attack.stealth
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: \regsvr32.exe
    CommandLine|contains|all:
    - '/i:'
    - scrobj
  condition: selection
falsepositives:
- Admin activity that looks the same
level: high
