description: Sample rule for T1684 Social Engineering. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before production use.
references:
- https://attack.mitre.org/techniques/T1684
author: Sigma Forge samples
date: '2026-11-11'
tags:
