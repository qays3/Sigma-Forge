title: Raw Disk Read With Shadow Path
id: 29483ae0-832a-57db-9adc-cd12b5170b5b
status: experimental
description: Sample rule for T1006 Direct Volume Access. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before production use.
references:
- https://attack.mitre.org/techniques/T1006
author: Sigma Forge samples
date: '2026-11-11'
tags:
- attack.stealth
- attack.t1006
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
    - \\.\PhysicalDrive0
    - GLOBALROOT\Device\HarddiskVolumeShadowCopy
  condition: selection
falsepositives:
- Admin activity that looks the same
level: high
