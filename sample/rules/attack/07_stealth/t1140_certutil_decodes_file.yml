title: Certutil Decodes File
id: 79db085f-e69a-5fdd-af9c-ae452b550c12
status: experimental
description: Sample rule for T1140 Deobfuscate/Decode Files or Information. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before
  production use.
references:
- https://attack.mitre.org/techniques/T1140
author: Sigma Forge samples
date: '2026-11-11'
tags:
- attack.stealth
- attack.t1140
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: \certutil.exe
    CommandLine|contains:
    - -decode
    - -decodehex
  condition: selection
falsepositives:
- Admin activity that looks the same
level: medium
