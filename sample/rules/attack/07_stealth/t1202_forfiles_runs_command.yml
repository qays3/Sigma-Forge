status: experimental
description: Sample rule for T1202 Indirect Command Execution. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before production
  use.
references:
- https://attack.mitre.org/techniques/T1202
author: Sigma Forge samples
date: '2026-11-11'
tags:
