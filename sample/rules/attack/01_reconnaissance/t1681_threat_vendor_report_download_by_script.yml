title: Threat Vendor Report Download By Script
id: 64635529-df0b-55d3-9541-fcaa0360dcda
status: experimental
description: Sample rule for T1681 Search Threat Vendor Data. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before production
  use.
references:
- https://attack.mitre.org/techniques/T1681
author: Sigma Forge samples
date: '2026-11-11'
tags:
- attack.reconnaissance
- attack.t1681
logsource:
  category: proxy
detection:
  selection:
    c-uri|endswith:
    - .stix
    - .stix2
    - /indicators.csv
    c-useragent|contains:
    - python
    - curl
  condition: selection
falsepositives:
- Admin activity that looks the same
level: low
