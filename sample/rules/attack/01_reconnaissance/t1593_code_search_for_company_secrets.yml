title: Code Search For Company Secrets
id: 54707a21-bb72-5ef9-8d02-bee66128832b
status: experimental
description: Sample rule for T1593 Search Open Websites/Domains. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before production
  use.
references:
- https://attack.mitre.org/techniques/T1593
author: Sigma Forge samples
date: '2026-11-11'
tags:
- attack.reconnaissance
- attack.t1593
logsource:
  category: proxy
detection:
  selection:
    c-uri|contains:
    - github.com/search
    - grep.app/search
    c-uri|contains|all:
    - corp-example
    - password
  condition: selection
falsepositives:
- Admin activity that looks the same
level: low
