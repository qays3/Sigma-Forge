title: Credential Phishing Link Opened From Email Client
id: 1c0e42f2-0a98-530a-af1c-78d9193215f1
status: experimental
description: Sample rule for T1598 Phishing for Information. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before production
  use.
references:
- https://attack.mitre.org/techniques/T1598
author: Sigma Forge samples
date: '2026-11-11'
tags:
- attack.reconnaissance
- attack.t1598
logsource:
  category: proxy
detection:
  selection:
    c-uri|contains:
    - /wp-includes/login
    - /owa-login
    - /microsoftonline-verify
    cs-referrer|contains:
    - outlook.office.com
    - mail.google.com
  condition: selection
falsepositives:
- Admin activity that looks the same
level: high
