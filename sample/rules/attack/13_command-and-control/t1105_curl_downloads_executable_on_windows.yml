title: Curl Downloads Executable On Windows
id: ff9158af-3a16-59cf-b291-d5373fa3157d
status: experimental
description: Sample rule for T1105 Ingress Tool Transfer. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before production use.
references:
- https://attack.mitre.org/techniques/T1105
author: Sigma Forge samples
date: '2026-11-11'
tags:
- attack.command-and-control
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: \curl.exe
    CommandLine|contains:
    - .exe
    - .dll
    - .ps1
    CommandLine|contains|all:
    - -o
    - http
  condition: selection
falsepositives:
- Admin activity that looks the same
level: medium
