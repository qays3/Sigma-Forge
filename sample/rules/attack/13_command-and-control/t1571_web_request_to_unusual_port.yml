title: Web Request To Unusual Port
id: 05ff6ab3-de62-5105-8ac4-79c5d542dbd1
status: experimental
description: Sample rule for T1571 Non-Standard Port. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before production use.
references:
- https://attack.mitre.org/techniques/T1571
author: Sigma Forge samples
date: '2026-11-11'
tags:
- attack.command-and-control
- attack.t1571
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    Image|endswith:
    - \powershell.exe
    - \mshta.exe
    DestinationPort:
    - 4444
    - 5555
    - 8888
    - 1337
  condition: selection
falsepositives:
- Admin activity that looks the same
level: high
