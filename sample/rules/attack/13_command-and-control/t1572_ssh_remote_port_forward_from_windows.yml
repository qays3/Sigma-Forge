title: SSH Remote Port Forward From Windows
id: 7e8ad28b-65da-5831-b888-d198e04cdb23
status: experimental
description: Sample rule for T1572 Protocol Tunneling. Part of the Sigma Forge ATT&CK pack that tags every Enterprise technique, so the coverage map lights up end to end. Tune it before production use.
references:
- https://attack.mitre.org/techniques/T1572
author: Sigma Forge samples
date: '2026-11-11'
tags:
- attack.command-and-control
- attack.t1572
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
    - \ssh.exe
    - \plink.exe
    CommandLine|contains:
    - ' -R '
    - ' -L '
    - ' -D '
  condition: selection
falsepositives:
- Admin activity that looks the same
level: medium
