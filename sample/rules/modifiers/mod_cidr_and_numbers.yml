title: Modifier Demo CIDR And Number Compare
id: 8611b069-58e1-4eb1-ba37-3584e0c1853a
status: test
description: Shows cidr for IP ranges and gte for numbers. Wazuh cannot do number compare, so this rule fails there on purpose.
author: Sigma Forge samples
date: 2026-11-11
tags:
  - attack.command-and-control
  - attack.t1571
logsource:
  product: windows
  category: network_connection
detection:
