title: Modifier Demo Cased And Wildcards
id: 70fa87cf-4c8d-4380-bbf1-8650a3a9eb4a
status: test
description: Shows the cased modifier and plain wildcards (star for many characters, question mark for one, backslash star for a real star).
author: Sigma Forge samples
date: 2026-11-11
tags:
  - attack.discovery
  - attack.t1087.002
logsource:
  product: windows
  category: process_creation
detection:
  selection_cased:
    CommandLine|cased|contains: 'AdFind'
  selection_wild:
    CommandLine:
      - '*-f ?objectcategory=computer*'
      - '*trustdmp*'
      - '*literal\*star*'
  condition: 1 of selection_*
falsepositives:
  - AD admins
level: medium
