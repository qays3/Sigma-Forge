title: Modifier Demo CIDR Ranges
id: 8611b069-58e1-4eb1-ba37-3584e0c1853a
status: test
description: Shows the cidr modifier for IP ranges, used to skip private addresses.
author: Sigma Forge samples
date: 2026-11-11
tags:
  - attack.command-and-control
  - attack.t1571
logsource:
  product: windows
  category: network_connection
detection:
  selection:
    Initiated: 'true'
    DestinationPort:
      - 4444
      - 8443
  filter_lan:
    DestinationIp|cidr: '192.168.0.0/16'
  condition: selection and not filter_lan
falsepositives:
  - Games and peer to peer apps
level: low
