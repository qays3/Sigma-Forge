title: Mshta Running Remote Script
id: a992abaa-8171-4430-98dd-e73151f652ff
status: test
description: First rule in a file with several rules.
author: Sigma Forge samples
date: 2026-11-11
tags:
  - attack.stealth
  - attack.t1218.005
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\mshta.exe'
    CommandLine|contains:
      - 'http://'
      - 'https://'
      - 'javascript:'
  condition: selection
level: high
