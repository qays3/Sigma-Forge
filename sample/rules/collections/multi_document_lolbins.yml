title: Wmic Remote Process Create
id: 761fc215-c022-4b5a-9a19-3dd9e0d2c70b
status: test
description: Third rule in the same file.
author: Sigma Forge samples
date: 2026-11-11
tags:
  - attack.execution
  - attack.t1047
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\wmic.exe'
    CommandLine|contains|all:
      - '/node:'
      - 'process call create'
  condition: selection
level: high
