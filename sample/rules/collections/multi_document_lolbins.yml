title: Bitsadmin Download To Temp
id: 39f93995-2886-4652-8efd-59501caadf27
status: test
description: Second rule in the same file.
author: Sigma Forge samples
date: 2026-11-11
tags:
  - attack.persistence
  - attack.t1197
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\bitsadmin.exe'
    CommandLine|contains|all:
      - '/transfer'
      - '\Temp\'
  condition: selection
level: medium
