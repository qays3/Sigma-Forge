[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma-forge"
version = "1.0.0"
description = "Write, check, convert, test and ship Sigma detection rules from one local web app."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "qays3" }]
keywords = ["sigma", "detection engineering", "siem", "soc", "yara", "att&ck"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Topic :: Security",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "requests>=2.32,<3.0",
    "regex>=2024.0",
    "python-multipart>=0.0.9",
    "evtx>=0.8,<1.0",
    "yara-python>=4.5",
    "PyYAML>=6.0",
    "pySigma>=1.5,<2.0",
    "pysigma-pipeline-sysmon>=2.0,<3.0",
    "pysigma-pipeline-windows>=2.0,<3.0",
    "pysigma-backend-splunk>=2.1,<3.0",
    "pySigma-backend-elasticsearch>=2.1,<3.0",
    "pySigma-backend-opensearch>=2.0,<3.0",
    "pySigma-backend-kusto>=1.0,<2.0",
    "pysigma-backend-crowdstrike>=3.0,<4.0",
    "pySigma-backend-secops>=1.0,<2.0",
    "pysigma-backend-sentinelone>=0.1.3",
    "pysigma-backend-sentinelone-pq>=0.1.6",
    "pysigma-backend-cortexxdr>=0.1.6",
    "pysigma-backend-carbonblack>=0.1.14",
    "pySigma-backend-loki>=0.15",
    "pysigma-backend-logpoint>=1.0",
    "pySigma-backend-netwitness>=0.3",
    "pySigma-backend-panther>=0.3",
    "pysigma-backend-sumologic>=0.2.5",
    "pySigma-backend-quickwit>=0.1.4",
    "pysigma-backend-clickhouse>=1.1",
    "pySigma-backend-sqlite>=2.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
legacy = [
    "pysigma-backend-qradar==0.3.3",
    "pySigma-backend-surrealql==0.1.0",
    "pysigma-backend-helix==0.1.2",
]

[project.urls]
Homepage = "https://github.com/qays3/Sigma-Forge"
Issues = "https://github.com/qays3/Sigma-Forge/issues"

[project.scripts]
sigma-forge = "app.cli:main"
sigma-forge-server = "app.main:run"

[tool.setuptools]
packages = ["app", "app.api", "app.core", "app.core.wazuh", "sigma_forge_share"]
include-package-data = false

[tool.setuptools.package-dir]
sigma_forge_share = "."

[tool.setuptools.package-data]
sigma_forge_share = [
    "web/*", "web/**/*",
    "sample/*", "sample/**/*",
    "data/attack/*", "data/atomic/*",
]
